name: Metrics

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jouryjc
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: columns
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_repositories: yes
          plugin_repositories_featured: >-
            Jouryjc/blogs,
            Jouryjc/atomic-request,
            Jouryjc/vite-webpack-plugin,
            Jouryjc/babel-plugin-transform-options-to-compositions,
            Jouryjc/browser-robot,
            Jouryjc/code-explain
          plugin_notable: yes
          plugin_notable_filter: stars:>500
          plugin_notable_from: all
          plugin_notable_types: pull_request
          plugin_followup: yes
          plugin_followup_sections: user
